name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Typecheck, lint, unit tests and database/RLS tests (migrations applied to PGlite).
      - run: pnpm check
      - run: pnpm --filter @peoplecore/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # Runtime dependencies must be clean; the full tree is reported but dev tooling may lag on patches.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
        continue-on-error: true
