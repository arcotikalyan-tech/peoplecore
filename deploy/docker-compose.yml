# PeopleCore on the Hostinger server (/opt/peoplecore). See docs/runbooks/server.md.
# The web app listens only on the bridge gateway of the shared Caddy's network (172.18.0.1), so the proxy can
# reach it and the internet cannot (Docker-published ports bypass ufw, hence no 0.0.0.0).
name: peoplecore
services:
  web:
    image: peoplecore-web:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Shown in Account settings, so anyone can see which build is live.
      APP_VERSION: ${TAG:-}
      APP_DEPLOYED_AT: ${DEPLOYED_AT:-}
    ports: ['172.18.0.1:3200:3000']
    logging: &logs
      # Docker keeps container logs forever by default; cap them so they can't fill the disk.
      driver: json-file
      options: { max-size: 20m, max-file: '5' }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: peoplecore-worker:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      WORKER_ID: hostinger-1
    logging: *logs
    # The worker touches this file on every pass (a job may run 4 minutes); unhealthy after 10 minutes without one.
    healthcheck:
      test: ['CMD', 'node', '-e', "const s=require('fs').statSync('/tmp/peoplecore-worker-alive');process.exit(Date.now()-s.mtimeMs<600000?0:1)"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s
