name: Deploy

# Production release, started by hand (Actions → Deploy → Run workflow, or `gh workflow run Deploy`) for a commit on
# main that passed CI. Manual on purpose: the repository's plan has no required reviewers for environments, so a
# person starting the run is the approval. Migrations first, then the web app on Vercel (the fallback). The Hostinger server is deployed from a Mac with
# deploy/ship.sh (docs/runbooks/server.md). Each job skips itself until its
# secrets exist (docs/runbooks/deploy.md).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Only main, and only a commit that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Deploy runs from main only."; exit 1; }
          # Waits (up to 40 minutes) for CI on this commit to finish, so a deploy can be started right after a push.
          # One query per check (status and conclusion together). A run that has just finished can show as
          # completed a few seconds before its conclusion does, so "finished but not passed" must be seen three
          # times in a row before the deploy gives up.
          misses=0
          for i in $(seq 1 120); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --json status,conclusion)
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then echo "CI passed for $GITHUB_SHA."; exit 0; fi
            total=$(jq 'length' <<<"$runs")
            open=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [ "$open" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$i" -gt 6 ]; }; then
              misses=$((misses + 1))
              if [ "$misses" -ge 3 ]; then
                echo "::error::CI did not pass for $GITHUB_SHA (failed, cancelled or never ran). Fix it and push again."; exit 1
              fi
              sleep 10; continue
            fi
            misses=0
            [ "$i" = 1 ] && echo "Waiting for CI on $GITHUB_SHA to finish…"
            sleep 20
          done
          echo "::error::CI on $GITHUB_SHA is still running after 40 minutes."; exit 1
      - id: ready
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Supabase secrets not set; skipping migrations."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - if: steps.ready.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # The list goes into the job log before anything is applied.
      - if: steps.ready.outputs.ok == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - if: steps.ready.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

  web:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - id: ready
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Vercel secrets not set; skipping the web deploy."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.ready.outputs.ok == 'true'
        run: corepack enable && pnpm install --frozen-lockfile
      # Environment variables (Supabase keys, AI key) live in the Vercel project, not in this repository.
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm dlx vercel@61.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm dlx vercel@61.1.0 build --prod --token="$VERCEL_TOKEN"
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm dlx vercel@61.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
