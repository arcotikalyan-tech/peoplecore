name: Worker

# The background worker as a scheduled pass (docs/runbooks/operations.md): enqueues the jobs that are due and runs a
# batch. Every 3 hours, because a private repository on the free plan has 2,000 Actions minutes a month (a pass
# takes 1-2 billed minutes, so hourly would use most of them alongside CI). Jobs are keyed by hour or day, so
# nothing is lost between passes; reminders and escalations just arrive up to 3 hours later. Move to an always-on
# host when that is too coarse. Skips itself until its
# secrets exist on the "production" environment.

# Since 2026-10-21 the worker runs always-on on the Hostinger server (docs/runbooks/server.md); this stays as a
# manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      WORKER_ONCE: '1'
      WORKER_ID: gha-${{ github.run_id }}
    steps:
      - id: ready
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Worker secrets not set; skipping."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.ready.outputs.ok == 'true'
        run: corepack enable && pnpm install --frozen-lockfile --filter @peoplecore/worker...
      - if: steps.ready.outputs.ok == 'true'
        run: pnpm --filter @peoplecore/worker start
